name: Flutter APK

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/flutter.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/mobile/**'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Decode keystore
        if: github.ref == 'refs/heads/main'
        working-directory: apps/mobile/android
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 --decode > keystore/locus-release.jks

      - name: Write key.properties
        if: github.ref == 'refs/heads/main'
        working-directory: apps/mobile/android
        env:
          KEY_ALIAS:      ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:   ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          cat > key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=../keystore/locus-release.jks
          EOF

      - name: Build APK
        working-directory: apps/mobile
        env:
          API_URL: ${{ secrets.MOBILE_API_URL || 'https://api.yourdomain.com/api' }}
        run: |
          flutter build apk --release \
            --dart-define=API_URL=$API_URL \
            --build-name=$(grep '^version:' pubspec.yaml | sed 's/version: //;s/+.*//' | tr -d ' ') \
            --build-number=${{ github.run_number }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: locus-release-${{ github.run_number }}.apk
          path: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mobile-v${{ github.run_number }}
          name: "Locus Android v1.0.0 (build ${{ github.run_number }})"
          files: apps/mobile/build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: false
          body: |
            Release APK — build ${{ github.run_number }}

            **Install:** Download `app-release.apk` and install on Android.
            Requires Android 5.0+.
