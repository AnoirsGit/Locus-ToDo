<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Locus — Print</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&family=Inter:wght@400;450;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
  /* ====== PRINT-SPECIFIC LAYOUT ====== */
  html, body { background: var(--paper); }

  .print-page {
    width: 1280px;
    min-height: 880px;
    margin: 0 auto;
    background: var(--paper);
    box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    page-break-after: always;
    break-after: page;
    overflow: hidden;
    position: relative;
  }
  .print-page:last-child { page-break-after: auto; break-after: auto; }

  /* The auth screens span 2 columns full width */
  .print-page.auth { padding: 0; }
  .print-page.auth .auth-wrap { min-height: 880px; }

  /* The standard app screens use sidebar + main */
  .print-page.app-screen { display: grid; grid-template-columns: var(--sidebar-w) 1fr; }
  .print-page.app-screen .sidebar { position: relative; height: auto; min-height: 880px; }
  .print-page.app-screen .main-inner { padding: 48px 56px 56px; max-width: none; }

  .print-caption {
    position: absolute;
    bottom: 16px;
    right: 24px;
    font-family: var(--font-mono);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.14em;
    color: var(--ink-4);
    z-index: 10;
  }

  body { padding: 32px 0; }

  @page { size: 13.5in 9.5in; margin: 0.4cm; }

  @media print {
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
    body { padding: 0; background: white; }
    .print-page {
      box-shadow: none;
      margin: 0;
      width: 100%;
      min-height: 0;
      page-break-after: always;
      break-after: page;
    }
    .print-page:last-child { page-break-after: auto; break-after: auto; }
    .print-page * {
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
    /* Remove hover-only background flickers */
    .task:hover { background: transparent !important; }
    .nav-item:hover { background: transparent !important; }
    .btn:hover { background: var(--card) !important; }
    /* Hide preview-only buttons */
    .preview-only { display: none !important; }
  }

  .preview-only { display: none; } /* always hidden — was for live app only */
</style>
<script>
  const TWEAK_DEFAULTS = {
    "overdueIntensity": "firm",
    "density": "regular",
    "showLevelBadges": true,
    "colorCheckboxes": true,
    "backlogTone": "reflective"
  };
</script>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="modals.jsx"></script>
<script type="text/babel" src="views.jsx"></script>
<script type="text/babel">
// Stub useTweaks/Tweaks panel pieces so views render statically
const NAV = [
  { id: 'today', label: 'Today', icon: 'Today' },
  { id: 'week', label: 'Week', icon: 'Week' },
  { id: 'month', label: 'Month', icon: 'Month' },
  { id: 'year', label: 'Year', icon: 'Year' },
];
const NAV_2 = [
  { id: 'backlog', label: 'Backlog', icon: 'Backlog' },
  { id: 'archive', label: 'Archive', icon: 'Archive' },
  { id: 'settings', label: 'Settings', icon: 'Settings' },
];

const StaticSidebar = ({ activeId, counts }) => (
  <aside className="sidebar">
    <div className="brand">
      <span className="brand-mark">Locus</span>
      <span className="brand-dot" />
    </div>
    <div className="nav-section">
      <div className="nav-label">Horizons</div>
      {NAV.map(n => {
        const Glyph = Icon[n.icon];
        return (
          <div key={n.id} className={`nav-item ${activeId === n.id ? 'active' : ''}`}>
            <span className="nav-item-glyph"><Glyph /></span>
            {n.label}
            {counts[n.id] != null && <span className="nav-count">{counts[n.id]}</span>}
          </div>
        );
      })}
    </div>
    <div className="nav-section">
      <div className="nav-label">Records</div>
      {NAV_2.map(n => {
        const Glyph = Icon[n.icon];
        const hasDot = n.id === 'backlog' && counts.backlog > 0;
        return (
          <div key={n.id} className={`nav-item ${activeId === n.id ? 'active' : ''} ${hasDot ? 'has-dot' : ''}`}>
            <span className="nav-item-glyph"><Glyph /></span>
            {n.label}
            {counts[n.id] != null && <span className="nav-count">{counts[n.id]}</span>}
          </div>
        );
      })}
    </div>
    <div className="user-card">
      <div className="user-avatar">L</div>
      <div style={{ minWidth: 0 }}>
        <div className="user-name">Lev Ostrovsky</div>
        <div className="user-email">lev@ostrovsky.studio</div>
      </div>
    </div>
  </aside>
);

const noop = () => {};

function PrintApp() {
  const tasks = SEED_TASKS;
  const counts = {
    today: tasks.filter(x => x.level === 'day' && (x.status === 'todo' || x.status === 'overdue')).length,
    week: tasks.filter(x => x.level === 'week' && (x.status === 'todo' || x.status === 'overdue')).length,
    month: tasks.filter(x => x.level === 'month' && (x.status === 'todo' || x.status === 'overdue')).length,
    year: tasks.filter(x => x.level === 'year' && (x.status === 'todo' || x.status === 'overdue')).length,
    backlog: tasks.filter(x => x.status === 'backlog').length,
    archive: tasks.filter(x => x.status === 'archived').length,
  };

  const Page = ({ id, label, children }) => (
    <div className="print-page app-screen">
      <StaticSidebar activeId={id} counts={counts} />
      <main className="main">
        <div className="main-inner">{children}</div>
        <div className="print-caption">{label}</div>
      </main>
    </div>
  );

  return (
    <>
      {/* 1 — Login */}
      <div className="print-page auth">
        <LoginScreen onSwitch={noop} onSubmit={noop} />
        <div className="print-caption">01 · Sign in</div>
      </div>

      {/* 2 — Register */}
      <div className="print-page auth">
        <RegisterScreen onSwitch={noop} onSubmit={noop} />
        <div className="print-caption">02 · Register</div>
      </div>

      {/* 3 — Today */}
      <Page id="today" label="03 · Today">
        <TodayView tasks={tasks} toggle={noop} openCmdK={noop} />
      </Page>

      {/* 4 — Week */}
      <Page id="week" label="04 · Week">
        <WeekView tasks={tasks} toggle={noop} />
      </Page>

      {/* 5 — Month */}
      <Page id="month" label="05 · Month">
        <MonthView tasks={tasks} toggle={noop} />
      </Page>

      {/* 6 — Year */}
      <Page id="year" label="06 · Year">
        <YearView tasks={tasks} toggle={noop} />
      </Page>

      {/* 7 — Backlog */}
      <Page id="backlog" label="07 · Backlog">
        <BacklogView tasks={tasks} openReplan={noop} />
      </Page>

      {/* 8 — Archive */}
      <Page id="archive" label="08 · Archive">
        <ArchiveView tasks={tasks} />
      </Page>

      {/* 9 — Settings */}
      <Page id="settings" label="09 · Settings">
        <SettingsView />
      </Page>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<PrintApp />);

// Auto-print after fonts + render settle
(async () => {
  try { if (document.fonts && document.fonts.ready) await document.fonts.ready; } catch (e) {}
  setTimeout(() => { window.print(); }, 1200);
})();
</script>
</body>
</html>
